<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Snake Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }
        #ui { position: absolute; top: 20px; left: 20px; color: #333; pointer-events: none; text-shadow: none; }
        #score { font-size: 24px; font-weight: bold; margin-top: 8px; color: #00aa44; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #333; text-align: center; display: none; background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; backdrop-filter: blur(12px); border: 2px solid #00aa44; box-shadow: 0 0 40px rgba(0,0,0,0.2); }
        #gameOver h2 { margin: 0 0 15px 0; font-size: 36px; color: #ff4444; text-shadow: none; }
        #finalScore { font-size: 22px; margin-bottom: 25px; color: #00aa44; }
        button { padding: 14px 32px; font-size: 20px; background: linear-gradient(135deg, #00c853, #00e676); border: none; color: #fff; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,200,83,0.4); transition: transform 0.1s; }
        button:hover { background: linear-gradient(135deg, #00e676, #69f0ae); transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        #instructions { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #666; pointer-events: none; font-size: 16px; letter-spacing: 2px; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-size: 32px; letter-spacing: 4px; text-transform: uppercase; color: #00aa44; text-shadow: 0 0 20px rgba(0,170,68,0.3);">3D Snake</div>
        <div id="score">Score: 0</div>
    </div>
    <div id="gameOver">
        <h2>Game Over</h2>
        <div id="finalScore">Score: 0</div>
        <button onclick="resetGame()">Play Again</button>
    </div>
    <div id="instructions">Arrow Keys to Move</div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0e0e0);
        scene.fog = new THREE.FogExp2(0xe0e0e0, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 25, 28);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(15, 25, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 60;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00aa44, 2, 20);
        pointLight.position.set(0, 3, 0);
        scene.add(pointLight);

        const gridHelper = new THREE.GridHelper(40, 40, 0x999999, 0xbbbbbb);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const boardSize = 20;
        const half = boardSize / 2;
        const cellSize = 1;

        // Border around play area
        const borderHeight = 1;
        const borderMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const borderGeo = new THREE.BoxGeometry(0.4, borderHeight, boardSize + 0.4);
        const borderLeft = new THREE.Mesh(borderGeo, borderMat);
        borderLeft.position.set(-half - 0.2, borderHeight / 2, 0);
        borderLeft.castShadow = true;
        borderLeft.receiveShadow = true;
        scene.add(borderLeft);

        const borderRight = new THREE.Mesh(borderGeo, borderMat);
        borderRight.position.set(half + 0.2, borderHeight / 2, 0);
        borderRight.castShadow = true;
        borderRight.receiveShadow = true;
        scene.add(borderRight);

        const borderGeo2 = new THREE.BoxGeometry(boardSize + 0.4, borderHeight, 0.4);
        const borderTop = new THREE.Mesh(borderGeo2, borderMat);
        borderTop.position.set(0, borderHeight / 2, -half - 0.2);
        borderTop.castShadow = true;
        borderTop.receiveShadow = true;
        scene.add(borderTop);

        const borderBottom = new THREE.Mesh(borderGeo2, borderMat);
        borderBottom.position.set(0, borderHeight / 2, half + 0.2);
        borderBottom.castShadow = true;
        borderBottom.receiveShadow = true;
        scene.add(borderBottom);

        let score = 0;
        let gameRunning = true;
        let lastMoveTime = 0;
        const moveInterval = 150;
        let direction = new THREE.Vector3(1, 0, 0);
        let nextDirection = new THREE.Vector3(1, 0, 0);

        // Each segment: { pos: Vector3, mesh: Mesh }
        const snake = [];

        const headMaterial = new THREE.MeshStandardMaterial({ color: 0x00aa00, emissive: 0x003300, roughness: 0.2, metalness: 0.1 });
        const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x007700, emissive: 0x001100, roughness: 0.3, metalness: 0.0 });
        const foodMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x330000, roughness: 0.1, metalness: 0.1 });

        function initSnake() {
            for (const seg of snake) {
                scene.remove(seg.mesh);
                seg.mesh.geometry.dispose();
                seg.mesh.material.dispose();
            }
            snake.length = 0;

            const startX = 0;
            const startZ = 0;
            // Add tail first, head last, so head ends up at snake[0]
            addSegment(startX - 2, 0, startZ, false);  // tail
            addSegment(startX - 1, 0, startZ, false);  // body
            addSegment(startX,     0, startZ, true);   // head
            direction.set(1, 0, 0);
            nextDirection.set(1, 0, 0);
        }

        function addSegment(x, y, z, isHead = false) {
            const geo = new THREE.BoxGeometry(0.85, 0.85, 0.85);
            const mat = isHead ? headMaterial : bodyMaterial;
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x * cellSize, 0.45, z * cellSize);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            snake.unshift({ pos: new THREE.Vector3(x, y, z), mesh: mesh });
        }

        let foodMesh;
        let foodPos = new THREE.Vector3(5, 0, 5);

        function spawnFood() {
            if (foodMesh) {
                scene.remove(foodMesh);
                foodMesh.geometry.dispose();
                foodMesh.material.dispose();
            }

            let valid = false;
            let x, z;
            while (!valid) {
                x = Math.floor(Math.random() * boardSize) - boardSize / 2;
                z = Math.floor(Math.random() * boardSize) - boardSize / 2;
                valid = true;
                for (const s of snake) {
                    if (s.pos.x === x && s.pos.z === z) { valid = false; break; }
                }
            }

            foodPos.set(x, 0, z);

            const geo = new THREE.IcosahedronGeometry(0.4, 2);
            foodMesh = new THREE.Mesh(geo, foodMaterial);
            foodMesh.position.set(x * cellSize, 0.4, z * cellSize);
            foodMesh.castShadow = true;
            scene.add(foodMesh);

            foodMesh.userData = { time: 0 };
        }

        function updateSnake() {
            if (!gameRunning) return;

            direction.copy(nextDirection);

            const head = snake[0].pos.clone();
            head.x += direction.x;
            head.z += direction.z;

            const half = boardSize / 2;
            if (head.x < -half || head.x >= half || head.z < -half || head.z >= half) {
                gameOver();
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].pos.x && head.z === snake[i].pos.z) {
                    gameOver();
                    return;
                }
            }

            const ateFood = (head.x === foodPos.x && head.z === foodPos.z);

            addSegment(head.x, head.y, head.z, true);
            if (snake[1]) snake[1].mesh.material = bodyMaterial;

            if (ateFood) {
                score += 10;
                document.getElementById('score').textContent = 'Score: ' + score;
                spawnFood();
            } else {
                const tail = snake.pop();
                scene.remove(tail.mesh);
                tail.mesh.geometry.dispose();
                tail.mesh.material.dispose();
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = 'Score: ' + score;
            document.getElementById('gameOver').style.display = 'block';
        }

        window.resetGame = function resetGame() {
            score = 0;
            document.getElementById('score').textContent = 'Score: 0';
            document.getElementById('gameOver').style.display = 'none';
            gameRunning = true;
            lastMoveTime = performance.now();
            initSnake();
            spawnFood();
        };

        window.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            switch (e.key) {
                case 'ArrowUp':
                    if (direction.z === 0) nextDirection.set(0, 0, -1);
                    break;
                case 'ArrowDown':
                    if (direction.z === 0) nextDirection.set(0, 0, 1);
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) nextDirection.set(-1, 0, 0);
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) nextDirection.set(1, 0, 0);
                    break;
            }
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = clock.getDelta();

            if (foodMesh) {
                foodMesh.userData.time += delta * 2;
                foodMesh.position.y = 0.4 + Math.sin(foodMesh.userData.time) * 0.15;
                foodMesh.rotation.y += delta;
                foodMesh.rotation.x += delta * 0.5;
            }

            if (gameRunning && time - lastMoveTime > moveInterval) {
                updateSnake();
                lastMoveTime = time;
            }

            camera.position.x = Math.sin(time * 0.001) * 2;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        resetGame();
        animate();
    </script>
</body>
</html>
